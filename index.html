<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>RAG PDF Upload</title>
</head>
<body>
  <h2>PDFアップロード</h2>

  <input type="file" id="pdfFile" accept="application/pdf" />
  <button onclick="uploadPdf()">アップロード</button>

  <div id="progressArea" style="display:none; margin-top:10px;">
  <progress id="progressBar" value="0" max="100" style="width:300px;"></progress>
  <span id="progressText">0%</span>
</div>



  <p id="result"></p>

  <hr>

  <h2>質問</h2>
  <input type="text" id="question" size="50">
  <button onclick="ask()">送信</button>

  <p id="answer"></p>

<script>

async function uploadPdf() {
  const fileInput = document.getElementById("pdfFile");
  const file = fileInput.files[0];

  const result = document.getElementById("result");
  // const loading = document.getElementById("loading");
  const progressArea = document.getElementById("progressArea");
  const progressBar = document.getElementById("progressBar");
  const progressText = document.getElementById("progressText");

  if (!file) {
    alert("PDFを選択してください");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  // 初期化
  result.innerText = "";
  // loading.style.display =  "none";
  progressArea.style.display = "block";
  progressBar.value = 0;
  progressText.innerText = "0%";

  const xhr = new XMLHttpRequest();
  xhr.open("POST", `${API_BASE}/upload_pdf`, true);

  // アップロード進捗
  xhr.upload.onprogress = function (event) {
    if (event.lengthComputable) {
      const percent = Math.round((event.loaded / event.total) * 100);
      progressBar.value = percent;
      progressText.innerText = `${percent}%`;
    }
  };

xhr.onload = function () {
  progressArea.style.display = "none";

  if (xhr.status === 200 || xhr.status === 202) {
    const data = JSON.parse(xhr.responseText);
    result.innerText = "アップロード完了。処理中です…";
    console.log("job_id:", data.job_id);
  } else {
    result.innerText = "アップロードに失敗しました";
  }
};


  xhr.onerror = function () {
    // loading.style.display = "none";
    progressArea.style.display = "none";
    result.innerText = "通信エラーが発生しました";
  };

  xhr.send(formData);
}





async function ask() {
  const question = document.getElementById("question").value;

  const res = await fetch(`${API_BASE}/ask`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ question })
  });

  const data = await res.json();
  document.getElementById("answer").innerText = data.answer;
}
</script>
</body>

<script>
const API_BASE = "https://rag-fastapi-backend-awpm.onrender.com";

let taskId = null;
let pollTimer = null;

async function uploadPdf() {
  const fileInput = document.getElementById("pdfFile");
  const file = fileInput.files[0];
  const result = document.getElementById("result");

  if (!file) {
    alert("PDFを選択してください");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  result.innerText = "アップロード中…";

  const res = await fetch(`${API_BASE}/upload_pdf`, {
    method: "POST",
    body: formData,
  });

  const data = await res.json();
  taskId = data.task_id;

  result.innerText = "アップロード完了。処理中です…";

  startPolling();
}

function startPolling() {
  pollTimer = setInterval(checkStatus, 1500);
}

async function checkStatus() {
  try {
    const res = await fetch(`${API_BASE}/status/${taskId}`);
    const data = await res.json();

    const result = document.getElementById("result");

    switch (data.phase) {
      case "split":
        result.innerText = "PDFを分割しています…";
        break;
      case "embed":
        result.innerText = "Embedding を作成しています…";
        break;
      case "upsert":
        result.innerText = "Pinecone に登録しています…";
        break;
      case "done":
        result.innerText = `完了！登録チャンク数：${data.chunks}`;
        clearInterval(pollTimer);
        break;
    }

    if (data.status === "error") {
      result.innerText = "エラーが発生しました";
      clearInterval(pollTimer);
    }

  } catch (e) {
    console.error(e);
    clearInterval(pollTimer);
  }
}
</script>
